name: Bug report
description: Report a reproducible issue without disclosing real assessment data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach live assessment reports, domain inventories, credentials, or secrets.**
        For vulnerabilities, use the private process in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: ThreatJET version or commit
      placeholder: "2.4.0 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: PowerShell version
      options:
        - Windows PowerShell 5.1
        - PowerShell 7.x on Windows
        - Other / unknown
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Use fabricated domains, names, and data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Share a minimal, safe reproduction with synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Remove sensitive information before posting.
    validations:
      required: false
